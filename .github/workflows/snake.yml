name: generate snake animation

on:
  schedule:
    # Refresh once a day so the animation tracks the contribution graph.
    - cron: "37 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required so the publish step can push to the output branch.
      contents: write

    steps:
      # svg-only is the lighter variant; we do not need the gif renderer.
      # Pinned to v3.5.0 rather than v3 so the render cannot change silently.
      - name: Render contribution snake
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # github_token defaults to the workflow token, which is enough to
          # read the contribution calendar.
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#00FF41&color_dots=#161B22,#004D14,#00892A,#00C63C,#00FF41

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
